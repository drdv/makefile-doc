# The platforms whose awk the tests run, in containers: `make ctest@<name>` (see
# test/README.md). Only awk runs in the container, so an image needs nothing else. A new
# table is a new platform.
#
#   image    the base image, or
#   build    a Containerfile that builds the base image (e.g., an awk compiled from source)
#   args     optional, with build: its build arguments (e.g., the version and its SHA256)
#   awk      the awk command to test (a pytest --awk value, e.g., "gawk --posix")
#   install  optional: a shell command that installs the awk in the container
#   ci       optional: true to also run the platform in CI (`make ctest@all` runs them all)

# ------------------------------------------------------------------------------------------
# mawk (the default awk of Debian and Ubuntu)
# ------------------------------------------------------------------------------------------

# mawk 1.3.3 (1996 code base)
[debian10]
image = "debian:10"
awk = "mawk"

# mawk 1.3.3
[ubuntu1804]
image = "ubuntu:18.04"
awk = "mawk"

# mawk 1.3.4 20200120
[debian12]
image = "debian:12"
awk = "mawk"
ci = true

# mawk 1.3.4 20240123
[ubuntu2404]
image = "ubuntu:24.04"
awk = "mawk"

# mawk 1.3.4 20260129
[ubuntu2604]
image = "ubuntu:26.04"
awk = "mawk"

# ------------------------------------------------------------------------------------------
# gawk (the default awk of the RHEL family and Fedora; a package elsewhere)
# ------------------------------------------------------------------------------------------

# gawk 3.1.7
[centos6]
image = "centos:6"
awk = "gawk"

# gawk 4.0.2
[centos7]
image = "centos:7"
awk = "gawk"

[amazonlinux2]
image = "amazonlinux:2"
awk = "gawk"
install = "command -v gawk || yum install -y -q gawk"

# gawk 4.2.1
[alma8]
image = "almalinux:8"
awk = "gawk"

[ubuntu2004-gawk]
image = "ubuntu:20.04"
awk = "gawk"
install = "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gawk"

# gawk 5.1.0
[alma9]
image = "almalinux:9"
awk = "gawk"
ci = true

[debian12-gawk]
image = "debian:12"
awk = "gawk"
install = "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gawk"

[fedora44]
image = "fedora:44"
awk = "gawk"
install = "command -v gawk || dnf install -y -q gawk"

[fedora45]
image = "fedora:45"
awk = "gawk"
install = "command -v gawk || dnf install -y -q gawk"

# ------------------------------------------------------------------------------------------
# busybox awk (the default awk of Alpine)
# ------------------------------------------------------------------------------------------

# busybox 1.31
[alpine312]
image = "alpine:3.12"
awk = "awk"

# busybox 1.36.1
[alpine320]
image = "alpine:3.20"
awk = "awk"

# busybox 1.37.0
[alpine323]
image = "alpine:3.23"
awk = "awk"
ci = true

# ------------------------------------------------------------------------------------------
# BWK awk (the one true awk; macOS runs in CI)
# ------------------------------------------------------------------------------------------

[alpine322-nawk]
image = "alpine:3.22"
awk = "nawk"
install = "apk add --no-cache -q nawk"

[debian11-original-awk]
image = "debian:11"
awk = "original-awk"
install = "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq original-awk"

[ubuntu2004-original-awk]
image = "ubuntu:20.04"
awk = "original-awk"
install = "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq original-awk"

[debian12-original-awk]
image = "debian:12"
awk = "original-awk"
install = "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq original-awk"

[ubuntu2404-original-awk]
image = "ubuntu:24.04"
awk = "original-awk"
install = "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq original-awk"

