# Expected warnings of `test/tools/run.py lint` (gawk --lint on the integration cases).
#
# Rules (defined in LINT_RULES of run.py): uninit-variable, uninit-argument, uninit-element,
# substr-start, substr-past-end, substr-empty, substr-length, no-close. A warning that
# matches no rule is `unknown` and is always reported.
#
# - ignore = [...]: rules that are never reported
# - [rule] allow = [...]: the expected names of a rule (shell-style patterns, e.g. COLOR_*);
#   for uninit-element, the name of the array
#
# An entry that expects no warning is reported after a run of all the cases.

ignore = [
  # substr idioms that return "" (in every awk variant we test): the part before or after a
  # match at the start or end of a string, the first or last character of an empty line
  "substr-length", "substr-past-end", "substr-empty",
  # files written with > (e.g., STDERR) are closed when awk exits
  "no-close",
]

[uninit-variable]
allow = [
  # options passed with -v: makefile-doc.awk sets a default when they are empty
  "OUTPUT_FORMAT", "EXPORT_THEME", "SUB", "DSUB", "VARS", "PADDING", "DEPRECATED", "OFFSET",
  "RECIPEPREFIX", "TARGETS_REGEX", "VARIABLES_REGEX", "COLOR", "COLOR_*",
  # internal options (STDERR is always set by run.py lint)
  "UNIT_TEST", "SHOW_HELP",
]

[uninit-argument]
allow = [
  "sub_array", # form_substitutions: the value of the option SUB or DSUB
]
