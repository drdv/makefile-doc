name: Release

# Pushing a tag (e.g., v1.10) runs the tests (the CI workflow), checks that the tag is the
# version of makefile-doc.awk and of the README, and creates a draft release with
# makefile-doc.awk and its checksum, and the message of the tag as notes; the draft is then
# reviewed and published on GitHub.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/main.yml

  draft:
    name: draft release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release

    steps:
      - name: check out the repository
        uses: actions/checkout@v6

      - name: check the version
        run: python3 tools/release.py check "$GITHUB_REF_NAME"

      - name: compute the checksum
        run: sha256sum makefile-doc.awk > makefile-doc.awk.sha256

      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          body=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" makefile-doc.awk makefile-doc.awk.sha256 \
            --draft --title "$GITHUB_REF_NAME: $subject" --notes "$body"
