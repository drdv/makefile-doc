name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

# a new push to a PR branch cancels the run of the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: check out the repository
        uses: actions/checkout@v4

      # uvx runs the ruff version pinned in the Makefile
      - name: install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: show tool versions
        run: |
          gawk --version | head -n 1
          make --version | head -n 1
          python3 --version
          uv --version

      - name: lint the awk code
        run: make lint-awk

      - name: lint the Python test tools
        run: make lint-py

      - name: check the version in the README
        run: make check-version

  test:
    name: ${{ matrix.awk }} ${{ matrix.awk_flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false # report the results of every awk variant
      matrix:
        include:
          - awk: gawk
          - awk: gawk
            awk_flags: --posix
          - awk: mawk
          - awk: mawk
            awk_flags: -W posix
          - awk: nawk
          - awk: bawk
          - awk: wak
          - awk: goawk

    steps:
      - name: check out the repository
        uses: actions/checkout@v4

      - name: show tool versions
        run: |
          make --version | head -n 1
          python3 --version

      # the built binary is cached; the key changes when test/deps.toml changes (e.g., a new
      # version), so the variant is built again then
      - name: restore ${{ matrix.awk }} from the cache
        if: matrix.awk != 'gawk'
        uses: actions/cache@v4
        with:
          path: test/bin/${{ matrix.awk }}
          key: ${{ matrix.awk }}-${{ runner.os }}-${{ hashFiles('test/deps.toml') }}

      - name: download and build ${{ matrix.awk }}
        run: make deps@${{ matrix.awk }}

      - name: integration tests
        run: make test@${{ matrix.awk }} AWK_FLAGS='${{ matrix.awk_flags }}'

      - name: unit tests
        run: make utest@${{ matrix.awk }} AWK_FLAGS='${{ matrix.awk_flags }}'

      - name: known bugs
        run: make bugs@${{ matrix.awk }} AWK_FLAGS='${{ matrix.awk_flags }}'
