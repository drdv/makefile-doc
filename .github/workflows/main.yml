name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab
  workflow_call: # run by release.yml before it creates a draft release

permissions:
  contents: read

# uv fails if uv.lock does not match pyproject.toml (instead of updating it)
env:
  UV_LOCKED: "1"

# a new push to a PR branch cancels the run of the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: check out the repository
        uses: actions/checkout@v6

      # uv runs Python, pytest and ruff (versions in pyproject.toml and uv.lock)
      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: show tool versions
        run: |
          gawk --version | head -n 1
          make --version | head -n 1
          uv --version
          uv run python --version

      - name: lint the awk code while running the tests (and check its global variables)
        run: make lint-tests

      - name: lint the Python test tools
        run: make lint-py

      - name: test the Python test tools
        run: make test-tools

  test:
    name: ${{ matrix.awk }} ${{ matrix.awk_flags }} ${{ matrix.os && '(macOS)' || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 15

    strategy:
      fail-fast: false # report the results of every awk variant
      matrix:
        include:
          - awk: gawk
          - awk: gawk
            awk_flags: --posix
          - awk: mawk
          - awk: mawk
            awk_flags: -W posix
          - awk: nawk
          - awk: bawk
          - awk: wak
          - awk: goawk
          - awk: awk # the awk that comes with macOS
            os: macos-latest

    steps:
      - name: check out the repository
        uses: actions/checkout@v6

      # macOS comes with GNU Make 3.81; the Makefile needs 4.0
      - name: install GNU Make (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          awk --version || true

      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: show tool versions
        run: |
          make --version | head -n 1
          uv --version
          uv run python --version

      # the built binary is cached; the key changes when test/tools/deps.toml (e.g., a new
      # version) or test/tools/deps.py changes, so the variant is built again then
      - name: restore ${{ matrix.awk }} from the cache
        if: matrix.awk != 'gawk' && matrix.awk != 'awk'
        uses: actions/cache@v6
        with:
          path: test/bin/${{ matrix.awk }}
          key: >-
            ${{ matrix.awk }}-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('test/tools/deps.toml', 'test/tools/deps.py') }}

      - name: download and build ${{ matrix.awk }}
        run: make deps@${{ matrix.awk }}

      # the cases of known bugs are part of both: they are expected to fail
      - name: integration tests
        run: make test@${{ matrix.awk }} AWK_FLAGS='${{ matrix.awk_flags }}'

      - name: unit tests
        run: make utest@${{ matrix.awk }} AWK_FLAGS='${{ matrix.awk_flags }}'

  # the platforms of test/containers.toml with `ci = true`, as the matrix of the next job
  platforms:
    name: list the container platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.list.outputs.platforms }}
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      - id: list
        run: echo "platforms=$(uv run python test/platforms.py list --ci --json)" >> "$GITHUB_OUTPUT"

  # the tests run on the runner; only awk runs in the container of the platform
  containers:
    name: ${{ matrix.platform.name }} (container)
    needs: platforms
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false # report the results of every platform
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      # A platform with `build` compiles its awk into an image. Like the awk binaries of
      # the job above, the image is cached, as a file; its name ends with a hash of what
      # defines it, so it is built again when that changes. The other platforms use an
      # image of a registry as it is: nothing to cache.
      - name: name of the built image
        if: matrix.platform.build
        id: image
        run: echo "tag=$(uv run python test/platforms.py image ${{ matrix.platform.name }})" >> "$GITHUB_OUTPUT"

      - name: restore the built image from the cache
        if: matrix.platform.build
        id: cache
        uses: actions/cache@v6
        with:
          path: image.tar
          key: ${{ steps.image.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

      - name: load the built image
        if: matrix.platform.build && steps.cache.outputs.cache-hit == 'true'
        run: podman load --input image.tar

      - name: integration and unit tests
        run: make ctest@${{ matrix.platform.name }}

      # stored in the cache when the job ends
      - name: save the built image
        if: matrix.platform.build && steps.cache.outputs.cache-hit != 'true'
        run: podman save --output image.tar ${{ steps.image.outputs.tag }}
