name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab (with a choice of jobs)
    inputs:
      linux:
        description: lint, and the tests on Linux
        type: boolean
        default: true
      macos:
        description: the tests on macOS
        type: boolean
        default: true
      windows:
        description: the tests on Windows
        type: boolean
        default: true
  workflow_call: # run by release.yml before it creates a draft release

permissions:
  contents: read

# uv fails if uv.lock does not match pyproject.toml (instead of updating it)
env:
  UV_LOCKED: "1"

# a new push to a PR branch cancels the run of the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    # a run started by the button runs only the jobs it chose; any other run runs them all
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: check out the repository
        uses: actions/checkout@v6

      # uv runs Python, pytest and ruff (versions in pyproject.toml and uv.lock)
      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: lint the awk code while running the tests (and check its global variables)
        run: uv run pytest test/test_lint.py

      - name: lint the Python test tools and the release tool
        run: |
          uv run ruff check test tools
          uv run ruff format --check test tools

  # the platforms of test/containers.toml with `ci = true`: the matrix of the next job
  platforms:
    name: list the platforms
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.list.outputs.platforms }}
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      - id: list
        run: echo "platforms=$(uv run python test/platforms.py list --ci --json)" >> "$GITHUB_OUTPUT"

  # the tests run on the runner; awk runs on it too (host platforms) or in a container
  tests:
    name: ${{ matrix.platform.name }}
    needs: platforms
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false # report the results of every platform
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.platforms) }}

    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      # a host platform with `build`: the binary built in a container (with its stamp) is
      # cached; a change of the Containerfiles or of containers.toml is a new key
      - name: restore the binary from the cache
        if: matrix.platform.build
        uses: actions/cache@v6
        with:
          path: test/bin
          key: >-
            ${{ matrix.platform.name }}-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('test/containers.toml', 'test/containers/*') }}

      # the cases of known bugs are part of them: they are expected to fail
      - name: integration and unit tests
        run: uv run pytest test/test_integration.py test/test_unit.py --platform ${{ matrix.platform.name }}

  # the awk that comes with macOS
  macos:
    name: host-awk (macOS)
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: integration and unit tests
        run: uv run pytest test/test_integration.py test/test_unit.py --platform host-awk

  # the awk that comes with Git for Windows (gawk on the MSYS runtime) and a native gawk
  windows:
    name: host-awk, windows-host-gawk (Windows)
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash # Git Bash: its awk is on the PATH

    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: install a native gawk
        run: choco install gawk --no-progress

      - name: integration and unit tests
        run: >-
          uv run pytest test/test_integration.py test/test_unit.py
          --platform host-awk --platform windows-host-gawk
