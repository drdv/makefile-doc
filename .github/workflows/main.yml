name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

# a new push to a PR branch cancels the run of the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.awk }} ${{ matrix.awk_flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false # report the results of every awk variant
      matrix:
        include:
          - awk: awk
          - awk: awk
            awk_flags: --posix
          - awk: mawk
          - awk: nawk
          - awk: wak
          - awk: goawk

    steps:
      - name: check out the repository
        uses: actions/checkout@v4

      - name: show tool versions
        run: |
          awk --version | head -n 1
          make --version | head -n 1
          python3 --version

      - name: download and build ${{ matrix.awk }}
        run: yes | make test/bin/${{ matrix.awk }}

      - name: integration tests
        run: make test AWK=${{ matrix.awk }} AWK_FLAGS='${{ matrix.awk_flags }}'

      - name: unit tests
        run: make utest AWK=${{ matrix.awk }} AWK_FLAGS='${{ matrix.awk_flags }}'

      - name: known bugs
        run: make bugs AWK=${{ matrix.awk }} AWK_FLAGS='${{ matrix.awk_flags }}'
