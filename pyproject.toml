[project]
name = "makefile-doc-dev"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=9.1", "tap.py>=3.2", "ruff>=0.16"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests_new"]
addopts = ["-ra", "-o", "verbosity_subtests=0", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
xfail_strict = true

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PT", "SIM", "RUF"]

# gawk --lint warnings that are expected (regexes, matched against "<file>: <message>")
[tool.makefile-doc.lint]
ignore = [
  # substr idioms that return "" in every awk
  'substr: (length \S+ is not >= 1|start index \S+ is past end of string|source string is zero length)',
  'no explicit close of file',
  # options passed with -v
  "makefile-doc.awk: reference to uninitialized variable `(OUTPUT_FORMAT|EXPORT_THEME|D?SUB|VARS|PADDING|DEPRECATED|OFFSET|RECIPEPREFIX|(TARGETS|VARIABLES)_REGEX|COLOR(_\\w+)?|UNIT_TEST|SHOW_HELP)'",
  "makefile-doc.awk: reference to uninitialized argument `sub_array'",
  # harness helpers that not every unit test file uses
  "function `(check_bug|check_true|stderr_text)' defined but never called directly",
  "(close: `STDERR' is not an open file|data file `STDERR' is empty)",
]
